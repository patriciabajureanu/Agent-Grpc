name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore "Agent Grpc.sln"
      - name: Build solution
        run: dotnet build "Agent Grpc.sln" --configuration Release --no-restore --warnaserror
